name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # docs: everything that feeds the published site - the Markdown/nav
    # sources and MkDocs config, the Python toolchain lockfiles, the CLI
    # reference generator's source (docs/reference/cli.md is generated
    # from cmd/contemper and never committed), and this workflow file.
    # README.md, CONTRIBUTING.md and SECURITY.md aren't part of the site
    # (mkdocs.yml's nav and edit_uri only cover docs/), so they don't
    # belong here.
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - mkdocs.yml
              - pyproject.toml
              - uv.lock
              - 'cmd/contemper/**'
              - .github/workflows/docs.yml

  build:
    # A distinct check name: ci.yml's skipped build matrix also reports
    # as plain "build", so requiring "build" would be ambiguous.
    name: docs-build
    needs: changes
    # On a PR, skip entirely (reported "skipped") unless docs actually
    # changed. On push-to-main and manual runs, always build: a full docs
    # build is a handful of seconds, cheaper than the path-filtered skip
    # logic it would take to avoid it.
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install MkDocs
        run: uv sync --locked
      # The CLI reference is generated from the command tree, never committed.
      - name: Generate CLI reference
        run: go run ./cmd/contemper gen-docs docs/reference/cli.md
      - name: Build site
        run: uv run --locked mkdocs build --strict
      - name: Upload site for preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/
          retention-days: 14
      - name: Explain how to preview
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Docs preview
          Download the **docs-site** artifact from this run, unzip it, and serve it
          locally (pages link by directory, so opening `index.html` directly won't
          navigate):

          ```sh
          unzip docs-site.zip -d docs-site && python3 -m http.server -d docs-site 8000
          ```

          Then open http://localhost:8000/.
          EOF
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  # Publishes to https://contemper-project.github.io/contemper/. Skipped while
  # the repository is private (GitHub Pages needs a public repo on this plan).
  # Requires Settings → Pages → Source: "GitHub Actions".
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
