name: Scorecard analysis

on:
  push:
    branches: [main]
  schedule:
    # Weekly, matching the upstream example workflow's cadence.
    - cron: '30 1 * * 6'
  branch_protection_rule:
  workflow_dispatch:

# Declared read-only at the workflow level; the analysis job below grants
# only the permissions Scorecard itself needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Publish SARIF to code scanning.
      id-token: write # Mint the OIDC token publish_results needs.
      contents: read
      actions: read # Read workflow run status for some checks (e.g. Token-Permissions).

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Scorecard's maintainers run a weekly scan of public GitHub repos
          # (see https://github.com/ossf/scorecard#public-data). Publishing
          # our own results replaces that scan with this workflow's, and is
          # required for the README badge and the scorecard.dev page.
          publish_results: true

      # Uploaded as a build artifact (available to anyone for 5 days) as
      # well as to code scanning below, matching the upstream example.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
