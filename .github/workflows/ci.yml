name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides which of the jobs below can possibly be affected by this
    # change, so docs-only PRs don't pay for the whole Go pipeline. A job
    # skipped by its `if:` still reports as "skipped", which satisfies a
    # required status check; a workflow that never runs at all (e.g. via
    # on.<event>.paths) does not, and blocks merges forever instead.
    #
    # Filter groups (add new directories to whichever applies):
    #   go: anything that can affect building, testing, linting, or
    #       booting the CLI - Go sources and modules, the Makefile, the
    #       goreleaser config, the hack/ scripts and helper images the
    #       e2e jobs build and run, the example images they boot, the
    #       support images the volumes e2e job installs, the embedded
    #       systemd-stub checksums, and this workflow file itself.
    #
    # Pushes to main and manual runs always report "go" as changed:
    # running the full pipeline there is cheap enough (it already does,
    # today) that a path-filtered skip isn't worth the extra logic.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - go.mod
              - go.sum
              - Makefile
              - '.goreleaser.y*ml'
              - '.golangci.y*ml'
              - 'hack/**'
              - 'examples/**'
              - 'support/**'
              - 'internal/uki/stubs/**'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Runs the linters and formatters configured in .golangci.yml
      # (gofmt and goimports included - "run", unlike "fmt", reports
      # formatting diffs rather than applying them) against the whole
      # module. This also covers go vet: golangci-lint's govet linter is
      # part of the enabled default set and runs the same analysis.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Verify embedded systemd-stub checksums
        working-directory: internal/uki/stubs
        run: sha256sum -c SHA256SUMS
      - name: shellcheck
        run: |
          shellcheck -s sh \
            support/volumes-support/base/usr/lib/contemper/format-volumes \
            support/volumes-support/openrc/etc/init.d/contemper-volumes \
            support/volumes-support/systemd/etc/systemd/system-generators/contemper-volumes \
            hack/e2e-volumes/files/check-volume.sh \
            hack/e2e-volumes/files/zzz-contemper-volume-test.start

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Host tools the disk assembler shells out to. Without them the
      # assembler tests skip rather than fail, so install them to get real
      # coverage. ubuntu-latest ships e2fsprogs already.
      - name: Install host tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: Install host tools (macOS)
        if: runner.os == 'macOS'
        run: brew install e2fsprogs
      # -coverpkg=./... attributes coverage to the package that actually
      # runs the code, not just the package whose test binary is running -
      # without it, code only exercised through another package's tests
      # (e.g. a higher-level package driving several internal ones) shows
      # as uncovered. On this module that raises the total by a few points
      # with no change to which tests run.
      # gotestsum (a tool in go.mod) runs go test and also writes a JUnit
      # report, which Codecov's test analytics reads (failures, flaky and
      # slow tests).
      - name: go test
        run: >-
          go tool gotestsum --format pkgname --junitfile junit.xml --
          -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: ${{ matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        # Also after a test failure: that's when the report is most useful.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          flags: ${{ matrix.os == 'ubuntu-latest' && 'linux' || 'macos' }}
          fail_ci_if_error: false

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/contemper

  e2e:
    # Boots each example end to end: podman build → convert --target
    # qemu → deploy --to local-qemu, waiting for the boot marker. One
    # matrix leg per init system: alpine/OpenRC, debian/systemd.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [alpine, debian]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The runner has /dev/kvm, but not accessible to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # podman and e2fsprogs are preinstalled on ubuntu-latest.
      - name: Install qemu and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - name: Boot test
        run: ./hack/e2e.sh --example ${{ matrix.example }} --timeout 300s
      - name: Upload serial log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-serial-log-${{ matrix.example }}
          path: _out/serial.log
          if-no-files-found: ignore

  e2e-variants:
    # Support-image variant resolution end to end: a dummy support image
    # with two branches pushed to a local registry (localhost:5555),
    # convert --support, asserting the resolved variants in
    # contemper.json, then the same boot as the `e2e` job but waiting for
    # the winning variant's own marker; plus two non-booting failure
    # cases (an ambiguous branch, and one with no match and no default).
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The runner has /dev/kvm, but not accessible to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # podman and e2fsprogs are preinstalled on ubuntu-latest.
      - name: Install qemu and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - name: Boot test with a dummy variant support image
        run: ./hack/e2e-variants.sh --timeout 300s
      - name: Upload serial log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-variants-serial-log
          path: _out/variants/serial.log
          if-no-files-found: ignore

  e2e-volumes:
    # Volumes end to end: a derived image (FROM one of the examples)
    # declaring one volume, converted with a locally-built
    # volumes-support helper (--volume-helper), deployed to check the
    # volume is formatted, labelled and mounted on first boot and its
    # data survives both a redeploy and an image update. One matrix leg
    # per init system - alpine/OpenRC, debian/systemd - so the helper's
    # systemd integration gets the same boot coverage the OpenRC one
    # already has. See hack/e2e-volumes.sh.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [alpine, debian]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The runner has /dev/kvm, but not accessible to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # podman and e2fsprogs are preinstalled on ubuntu-latest.
      - name: Install qemu and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - name: Boot test with volumes
        run: ./hack/e2e-volumes.sh --example ${{ matrix.example }} --timeout 300s
      - name: Upload serial logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-volumes-serial-logs-${{ matrix.example }}
          path: _out/volumes/serial-*.log
          if-no-files-found: ignore

  ci-result:
    # The one check to mark required in branch protection instead of any
    # job above. A matrix job skipped by its own `if:` reports a single
    # check named after the job with no matrix values (e.g. "e2e", not
    # "e2e (alpine)") - a rule requiring "e2e (alpine)" or
    # "build (linux, amd64)" by name would then wait forever on a
    # docs-only PR, since that exact check never gets created. This job
    # always runs and always has a stable name, and succeeds whenever
    # every job it depends on is either "success" or "skipped".
    needs: [changes, lint, test, build, e2e, e2e-variants, e2e-volumes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check whether any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
