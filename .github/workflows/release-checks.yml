name: Release checks

# Keeps the release pipeline honest on every PR, without touching ci.yml:
# - the GoReleaser config is validated and dry-run built (no publishing).
# - every commit on the PR (not just its title) is checked against
#   Conventional Commits, since PRs are rebase-merged and release-please
#   parses each commit individually, and against the DCO (see
#   CONTRIBUTING.md).
#
# Also runs on push to main, where it always does the full 4-target
# snapshot release, so packaging breakage from a PR that took the
# lighter path below shows up on main before a release PR does.
# commit-checks has nothing to check outside a PR and is skipped there.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Mirrors ci.yml's "go" filter group, so "go changed" means the same
    # thing in both workflows: Go sources and modules, the Makefile, the
    # goreleaser config, and this workflow file. (hack/**, examples/** and
    # support/** are part of ci.yml's group too, but don't affect what
    # GoReleaser packages; left in here anyway since the snapshot build
    # is cheap and a second, narrower list would be one more place to
    # keep in sync.)
    #
    # "release" is narrower: only the inputs that actually change what
    # GoReleaser packages (its config, the archived license files, the
    # Go version). Only these are worth paying for a full 4-target
    # snapshot release on a PR; everything else in "go" already gets a
    # `goreleaser check` plus a single-target build, and its cross-compile
    # coverage from ci.yml's own build matrix.
    #
    # Like ci.yml, both outputs are forced true for non-pull_request
    # events (the push-to-main run here) rather than trusting the filter,
    # since paths-filter's push comparison depends on the SHAs GitHub
    # attaches to the push event.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      release: ${{ github.event_name != 'pull_request' || steps.filter.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - go.mod
              - go.sum
              - Makefile
              - '.goreleaser.y*ml'
              - 'hack/**'
              - 'examples/**'
              - 'support/**'
              - 'internal/uki/stubs/**'
              - .github/workflows/release-checks.yml
            release:
              - '.goreleaser.y*ml'
              - .github/workflows/release.yml
              - .github/workflows/release-checks.yml
              - go.mod
              - LICENSE
              - NOTICE
              - README.md
              - 'internal/uki/stubs/LICENSE*'

  commit-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit subjects are Conventional Commits
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|perf|deps|docs|refactor|test|build|ci|chore|revert)(\([a-z0-9,/ -]+\))?!?: .+'
          # Full history (the checkout above has fetch-depth: 0): a
          # --depth=1 fetch would graft the base branch, so a PR based on an
          # older base commit would list every commit in the repository.
          git fetch --no-tags origin "$BASE_REF"
          status=0
          while IFS= read -r sha; do
            subject="$(git log -1 --format=%s "$sha")"
            if [[ "$subject" =~ $pattern ]]; then
              echo "ok:      $sha $subject"
            else
              echo "::error::commit $sha is not a Conventional Commit: $subject"
              status=1
            fi
          done < <(git rev-list --no-merges "origin/${BASE_REF}..${HEAD_SHA}")
          exit "$status"
      - name: Check commits are signed off (DCO)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r sha; do
            name="$(git log -1 --format=%an "$sha")"
            email="$(git log -1 --format=%ae "$sha")"
            subject="$(git log -1 --format=%s "$sha")"

            # Bot-authored commits (Renovate, release-please via
            # GITHUB_TOKEN) can't sign off on their own account; skip them.
            if [[ "$email" == *"[bot]@users.noreply.github.com" ]]; then
              echo "skip (bot author): $sha $email"
              continue
            fi

            trailers="$(git log -1 --format=%B "$sha" | git interpret-trailers --parse)"
            expected="Signed-off-by: ${name} <${email}>"
            if grep -qF "$expected" <<<"$trailers"; then
              echo "ok:                $sha $expected"
            else
              echo "::error::commit $sha ($subject) has no '$expected' trailer"
              status=1
            fi
          done < <(git rev-list --no-merges "origin/${BASE_REF}..${HEAD_SHA}")
          if [ "$status" -ne 0 ]; then
            echo "::error::fix with: git rebase --signoff origin/${BASE_REF}, then force-push"
          fi
          exit "$status"

  goreleaser:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pin GoReleaser's own version here and in release.yml to the same
      # value, so this snapshot build always matches what actually
      # publishes a release.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          install-only: true
      - name: goreleaser check
        run: goreleaser check
      # The full snapshot builds and archives all 4 release targets, which
      # is where nearly all of this job's time goes; only pay for that
      # when something that changes what gets released is on the line
      # (release-affecting files, or a push to main).
      # Everything else already gets `goreleaser check` above plus a
      # single-target build, which exercises the same build config
      # (ldflags, -trimpath, the reproducible mod_timestamp) without the
      # other 3 cross-compiles - those are covered, config-mechanics
      # aside, by ci.yml's own build matrix on the same PR.
      - name: goreleaser snapshot build (full)
        if: needs.changes.outputs.release == 'true'
        run: goreleaser release --snapshot --clean
      # Cheap sanity check that the shell completions actually made it into
      # what got built, on top of the config-level `goreleaser check` above:
      # one archive and one deb, both already sitting in dist/ from the
      # snapshot build just above.
      - name: assert shell completions shipped
        if: needs.changes.outputs.release == 'true'
        run: |
          set -euo pipefail
          # List each artifact once instead of piping into `grep -q`, which
          # can exit before the lister is done and fail the step under
          # pipefail.
          archive_files="$(tar tzf dist/*_linux_amd64.tar.gz)"
          for f in completions/contemper.bash completions/_contemper completions/contemper.fish; do
            grep -qx "$f" <<<"$archive_files"
          done
          deb_files="$(dpkg-deb -c dist/*_amd64.deb | awk '{print $6}')"
          for f in /usr/share/bash-completion/completions/contemper \
                   /usr/share/zsh/vendor-completions/_contemper \
                   /usr/share/fish/vendor_completions.d/contemper.fish; do
            grep -qx ".${f}" <<<"$deb_files"
          done
      - name: goreleaser snapshot build (single-target)
        if: needs.changes.outputs.release != 'true'
        run: goreleaser build --snapshot --clean --single-target

  release-checks-result:
    # The one check to mark required in branch protection, mirroring
    # ci.yml's ci-result: neither commit-checks nor goreleaser is a
    # matrix job, so their own skip already reports under their own name,
    # but this keeps one stable required check per workflow rather than
    # two names to track, and matches the pattern if either job ever
    # grows a matrix.
    needs: [changes, commit-checks, goreleaser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check whether any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
