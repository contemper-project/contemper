name: arm64 nightly

# The arm64 bootloader test: three boots with an in-guest kernel update,
# once without and once with UEFI Secure Boot. The hosted arm64 runner
# has no /dev/kvm (and won't get it, see
# https://github.com/actions/runner-images/issues/14062), so QEMU runs
# under TCG and the test takes too long to gate every PR. It runs on a
# schedule instead and is deliberately not part of ci.yml's `ci-result`;
# a failure shows up as a red run here.

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hack/e2e-bootloader*'
      - 'examples/debian-grub/**'
      - 'internal/qemu/**'
      - 'internal/validate/**'
      - '.github/workflows/arm64-nightly.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-bootloader:
    name: e2e-bootloader (secure boot ${{ matrix.secure-boot && 'on' || 'off' }}, arm64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        secure-boot: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Without /dev/kvm QEMU falls back to TCG on its own; only set up
      # KVM access if the device exists.
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "no /dev/kvm on this runner; QEMU will use TCG"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # podman and e2fsprogs are preinstalled on the runner. ipxe-qemu
      # provides the virtio network ROMs QEMU needs for virtio-net-pci,
      # which --no-install-recommends would otherwise skip.
      # qemu-efi-aarch64 provides AAVMF (contemper looks for
      # AAVMF_CODE.secboot.fd and AAVMF_VARS.ms.fd for Secure Boot).
      - name: Install qemu and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils qemu-efi-aarch64 ipxe-qemu
          ls -l /usr/share/AAVMF
      - name: Boot test with an in-guest kernel update
        run: >-
          ./hack/e2e-bootloader.sh --timeout 2400s
          ${{ matrix.secure-boot && '--secure-boot' || '' }}
      - name: Upload serial log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-bootloader-arm64-secure-boot-${{ matrix.secure-boot }}-serial-log
          path: _out/bootloader/serial.log
          if-no-files-found: ignore
