name: Release

# release-please watches every push to main for Conventional Commits and
# maintains a standing release PR. Merging that PR is what cuts a release:
# release-please tags the merge commit and publishes a GitHub Release with
# its own changelog-derived notes, then (in the same run, since a tag
# release-please creates with GITHUB_TOKEN doesn't trigger other workflows)
# GoReleaser checks out that tag and attaches the built binaries to it.
on:
  push:
    branches: [main]

# Each job below declares only the permissions it needs; nothing is
# granted by default.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pin GoReleaser's own version here and in release-checks.yml's
      # snapshot build to the same value, so a PR's dry run always matches
      # what actually publishes a release.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed, Sigstore-backed build provenance for everything GoReleaser
      # just built. checksums.txt itself is one subject; subject-checksums
      # attests every archive it lists in one step, keyed to the same
      # digests a `sha256sum -c` against that file would verify. Anyone can
      # check either with `gh attestation verify`.
      - name: Attest checksums.txt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
